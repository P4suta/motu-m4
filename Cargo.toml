[workspace]
members = [
  "crates/motu-m4-core",
  "crates/motu-m4-audio",
  "crates/motu-m4-firmware",
  "crates/motu-m4",
  "xtask",
]
resolver = "2"
exclude = ["vendor/armagnac"]

[patch.crates-io]
armagnac = { path = "vendor/armagnac" }

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
overflow-checks = true
