[package]
name = "motu-m4"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
publish = false

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
motu-m4-core = { path = "../motu-m4-core" }
motu-m4-firmware = { path = "../motu-m4-firmware" }

[target.'cfg(target_os = "linux")'.dependencies]
motu-m4-audio = { path = "../motu-m4-audio" }
ctrlc = { version = "=3.5.2", features = ["termination"] }
serde_json = "=1.0.154"

[dev-dependencies]
hound = "=3.5.1"

[lints]
workspace = true
